# ============================================================
# HOWTO: Populate secrets before deploying to the cluster
# ============================================================
#
# 1. Generate cryptographic secrets (run each command once):
#
#   JWT_SECRET:              openssl rand -base64 32
#   REFRESH_TOKEN_SECRET:    openssl rand -base64 32
#   COOKIE_SECRET:           openssl rand -base64 32
#   ENCRYPTION_KEY:          openssl rand -base64 32
#   POSTGRES_PASSWORD:       openssl rand -base64 24
#   REDIS_PASSWORD:          openssl rand -base64 24
#
# 2. Replace every "REPLACE_WITH_*" placeholder below with the
#    generated value.
#
# 3. Set database-url and redis-url to use the in-cluster service
#    names once postgres and redis are deployed:
#
#   database-url:
#     postgresql://cardiowatch:<POSTGRES_PASSWORD>@cardiowatch-postgres:5432/cardiowatch
#
#   redis-url:
#     redis://:<REDIS_PASSWORD>@cardiowatch-redis:6379
#
# 4. Apply the secret — do NOT commit the populated file to git:
#
#   kubectl apply -f infrastructure/kubernetes/secrets.yaml -n cardiowatch
#
# 5. For production, prefer external-secrets-operator or sealed-secrets
#    over storing plaintext values in this file.
# ============================================================
#
# WARNING: This is a template. Never commit actual secrets to git!
# Use kubectl create secret or external-secrets-operator in production

apiVersion: v1
kind: Secret
metadata:
  name: cardiowatch-secrets
  namespace: cardiowatch
  labels:
    app: cardiowatch
type: Opaque
stringData:
  # Database
  database-url: "postgresql://user:password@postgres-host:5432/cardiowatch"

  # Redis
  redis-url: "redis://:password@redis-host:6379"

  # PostgreSQL password (must match POSTGRES_PASSWORD in postgres-deployment.yaml)
  postgres-password: "REPLACE_WITH_SECURE_PASSWORD"

  # Redis password (must match REDIS_PASSWORD in redis-deployment.yaml)
  redis-password: "REPLACE_WITH_SECURE_PASSWORD"

  # JWT Secrets (generate with: openssl rand -base64 32)
  jwt-secret: "REPLACE_WITH_SECURE_32_CHAR_SECRET"
  refresh-token-secret: "REPLACE_WITH_SECURE_32_CHAR_SECRET"
  cookie-secret: "REPLACE_WITH_SECURE_32_CHAR_SECRET"

  # Encryption Key (AES-256)
  encryption-key: "REPLACE_WITH_SECURE_32_CHAR_SECRET"

  # WhatsApp Business API
  whatsapp-access-token: ""
  whatsapp-phone-number-id: ""
  whatsapp-webhook-secret: ""
  whatsapp-webhook-verify-token: ""

  # Apple Watch / HealthKit
  apple-webhook-secret: ""

  # Google Fit / Health Connect
  google-client-id: ""
  google-client-secret: ""
  google-redirect-uri: ""
  health-connect-webhook-secret: ""

  # Sentry DSN
  sentry-dsn: ""

---
# Service Account for API pods
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cardiowatch-api
  namespace: cardiowatch
  labels:
    app: cardiowatch

---
# Network Policy - Restrict traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cardiowatch-api-network-policy
  namespace: cardiowatch
spec:
  podSelector:
    matchLabels:
      app: cardiowatch
      component: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
        - podSelector:
            matchLabels:
              app: cardiowatch
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
