apiVersion: apps/v1
kind: Deployment
metadata:
  name: cardiowatch-redis
  namespace: cardiowatch
  labels:
    app: cardiowatch
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cardiowatch
      component: redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: cardiowatch
        component: redis
    spec:
      securityContext:
        runAsUser: 999    # redis user inside image
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)"]
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cardiowatch-secrets
                  key: redis-password
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            exec:
              command: ["redis-cli", "-a", "$(REDIS_PASSWORD)", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["redis-cli", "-a", "$(REDIS_PASSWORD)", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      # No PVC — Redis is used as cache only; data loss on restart is acceptable
---
apiVersion: v1
kind: Service
metadata:
  name: cardiowatch-redis
  namespace: cardiowatch
  labels:
    app: cardiowatch
    component: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    app: cardiowatch
    component: redis
