# Namespace must exist first — apply namespace.yaml before this file
# kubectl apply -f infrastructure/kubernetes/
# Secrets must be populated — see secrets.yaml HOWTO block

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: cardiowatch
  labels:
    app: cardiowatch
    component: postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cardiowatch-postgres
  namespace: cardiowatch
  labels:
    app: cardiowatch
    component: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cardiowatch
      component: postgres
  strategy:
    type: Recreate        # Required for single-replica + PVC
  template:
    metadata:
      labels:
        app: cardiowatch
        component: postgres
    spec:
      securityContext:
        runAsUser: 999    # postgres user inside image
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: "cardiowatch"
            - name: POSTGRES_USER
              value: "cardiowatch"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cardiowatch-secrets
                  key: postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "cardiowatch", "-d", "cardiowatch"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "cardiowatch", "-d", "cardiowatch"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: cardiowatch-postgres
  namespace: cardiowatch
  labels:
    app: cardiowatch
    component: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    app: cardiowatch
    component: postgres
